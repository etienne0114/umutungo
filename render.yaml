services:
  - type: web
    name: umutungo
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn govasset_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: AUTH_REQUIRED
        value: "true"
      - key: CORS_ORIGINS
        value: https://umutungo7.vercel.app,https://umutungo-five.vercel.app,https://umutungo-etienne0114s-projects.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
